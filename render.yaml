services:
  - type: web
    name: ai-toxicity-predictor
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements-cpu.txt"
    startCommand: "uvicorn app.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_ID
        value: jintannn/jigsaw-toxicity-distilbert-v4
      - key: CYBERBULLY_MODEL_ID
        value: jintannn/cyberbully-multilabel-v1
